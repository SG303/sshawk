name: test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check src tests
      - run: uv run pytest

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev --group build --python 3.13
      - run: uv run --no-sync python packaging/build.py
      - name: Smoke test
        run: |
          dist\sshawk.exe --version
          dist\sshawk.exe platforms
        shell: cmd
      - run: Rename-Item dist\sshawk.exe sshawk-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: sshawk-windows-x86_64
          path: dist/sshawk-windows-x86_64.exe

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packaging/build-linux.sh
      - name: Smoke test on an old distribution
        run: docker run --rm -v "$PWD/dist:/d:ro" debian:10-slim /d/sshawk-linux-x86_64 platforms
      - uses: actions/upload-artifact@v4
        with:
          name: sshawk-linux-x86_64
          path: dist/sshawk-linux-x86_64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum sshawk-* > SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" sshawk-* SHA256SUMS.txt \
            --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
