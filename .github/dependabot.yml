# Dependabot config (SG303 baseline v1). Weekly on Sunday evening, minor and
# patch updates grouped into one PR per ecosystem and merged automatically by
# dependabot-auto-merge.yml once the checks pass. Majors come as separate PRs.
# The 7-day cooldown skips versions younger than a week; security updates are
# not delayed.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]
    ignore:
      # paramiko 5 drops SHA-1 host keys/key exchanges needed for older devices (see pyproject.toml).
      - dependency-name: paramiko
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
