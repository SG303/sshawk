[project]
name = "sshawk"
version = "0.2.0"
description = "Collect inventory data (models, serials, firmware, neighbors) from network devices over SSH"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "netmiko>=4.8",
    # paramiko 5 removed SHA-1 host keys and key exchanges (ssh-rsa, diffie-hellman-*-sha1)
    # without an opt-in, which locks sshawk out of older switches (e.g. Cisco IOS 15.x).
    # Stay on 4.x until legacy algorithms can be enabled explicitly.
    "paramiko>=4,<5",
    "ntc-templates>=8.1",
    "openpyxl>=3.1",
    "rich>=13",
]

[project.scripts]
sshawk = "sshawk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.10",
]

[tool.uv]
# Floors for transitive dependencies with known vulnerabilities in older releases.
constraint-dependencies = [
    "cryptography>=50.0.0",
    "pygments>=2.20.0",
    "pynacl>=1.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sshawk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Embedded CSS/JS and fixture-like strings read better unwrapped.
"src/sshawk/export/html.py" = ["E501"]
"tests/*" = ["E501"]
